services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appnet

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - appnet

  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: app_pass
    volumes:
      - ./apps/api/src/database/migrations:/migrations:ro
    command: >
      sh -c '
      set -e;
      psql -h postgres -U app -d app_db -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (version TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());";
      for file in /migrations/*.sql; do
        version=$$(basename "$$file");
        applied=$$(psql -h postgres -U app -d app_db -tAc "SELECT 1 FROM schema_migrations WHERE version = '\''$$version'\'' LIMIT 1");
        if [ "$$applied" = "1" ]; then
          echo "skip $$version";
        else
          echo "apply $$version";
          psql -h postgres -U app -d app_db -v ON_ERROR_STOP=1 -f "$$file";
          psql -h postgres -U app -d app_db -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations(version) VALUES ('\''$$version'\'');";
        fi;
      done;
      '
    networks:
      - appnet

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://app:app_pass@postgres:5432/app_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MASTER_KEY: ${MASTER_KEY}
      NODE_ENV: production
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - appnet

  web:
    build:
      context: ./apps/web
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - appnet

networks:
  appnet:

volumes:
  pgdata:
  redisdata:
